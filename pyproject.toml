[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clock3"
version = "1.0.0"
description = "智能桌面宠物闹钟应用"
requires-python = ">=3.8"
dependencies = [
    "kivy>=2.3.0,<3.0.0",
    "plyer>=2.1.0,<3.0.0",
]

[tool.setuptools]
packages = ["app"]
