name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4

    - name: Prepare
      run: |
        mkdir -p assets bin
        touch assets/alarm.mp3
        touch assets/icon.png

    - name: Build with Docker
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        options: -v ${{ github.workspace }}:/home/user/clock3 -w /home/user/clock3 -u root
        run: |
          ls -la
          buildozer android debug
          echo "=== Find APK ==="
          find . -name "*.apk" 2>/dev/null || true
          echo "=== Copy APK to bin ==="
          find . -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true
          ls -la bin/ || true

    - name: Check
      if: always()
      run: |
        ls -la bin/ || true
        find . -name "*.apk" 2>/dev/null || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clock3-apk
        path: |
          bin/*.apk

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: |
          buildozer.log
          .buildozer/logs/*
