name: Build Android APK with Docker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILDOZER_VERSION: latest

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build APK using Kivy Buildozer Docker
      run: |
        echo "=== Pulling buildozer image ==="
        docker pull kivy/buildozer:latest
        
        echo "=== Starting build ==="
        docker run --rm \
          -v $(pwd):/home/user/clock3 \
          -w /home/user/clock3 \
          kivy/buildozer \
          /bin/sh -c "
            mkdir -p ~/.buildozer
            buildozer android debug 2>&1
          "
        
        echo "=== Build completed ==="
        ls -la bin/ 2>/dev/null || echo "No bin directory"
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clock3-debug-apk
        path: |
          bin/*.apk
          .buildozer/android/platform/build-armeabi-v7a/dists/*.apk
          .buildozer/android/platform/build-arm64-v8a/dists/*.apk
        retention-days: 30
        overwrite: true

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.10'}
    - run: pip install flake8
    - run: |
        for f in app/main.py app/config.py app/database.py app/models/*.py app/services/*.py; do
          python -m py_compile "$f" && echo "✓ $f" || echo "✗ $f FAILED"
        done

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.10'}
    - run: pip install kivy plyer
    - run: |
        python -c "from app.models.alarm import Alarm; print('✓ Alarm')"
        python -c "from app.models.countdown import Countdown; print('✓ Countdown')"
        python -c "from app.models.pet import Pet; print('✓ Pet')"
        python -c "from app.services.alarm_service import alarm_service; print('✓ Alarm service')"
        python -c "from app.services.countdown_service import countdown_service; print('✓ Countdown service')"
        python -c "from app.services.pet_service import pet_service; print('✓ Pet service')"
        python -c "from app.config import config; print('✓ Config')"
        python -c "from app.database import db; print('✓ Database')"
