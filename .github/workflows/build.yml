name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Prepare assets
      run: |
        mkdir -p assets
        touch assets/alarm.mp3
        touch assets/icon.png
        ls -la assets/
    
    - name: Build APK with Docker
      run: |
        set -e
        
        echo "=== Building APK with kivy/buildozer Docker ==="
        
        docker run --rm \
          -v $(pwd):/home/user/clock3 \
          -w /home/user/clock3 \
          kivy/buildozer:latest \
          /bin/sh -c "
            set -e
            echo '=== Docker Environment ==='
            pwd
            ls -la
            echo 'sdk.dir=/opt/android-sdk' > local.properties
            echo '=== Starting build ==='
            buildozer android debug
            echo '=== Build completed ==='
            find . -name '*.apk' -type f
          "
        
        echo "=== Checking for APK ==="
        APK_FILES=$(find . -name "*.apk" -type f 2>/dev/null)
        if [ -n "$APK_FILES" ]; then
          echo "Found APK files:"
          echo "$APK_FILES"
          ls -lh $APK_FILES
        else
          echo "No APK found in current directory"
          find . -name "*.apk" 2>/dev/null || echo "Searching in .buildozer..."
          find .buildozer -name "*.apk" 2>/dev/null || true
          echo "Build may have failed silently"
          exit 1
        fi
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
          .buildozer/**/bin/*.apk
          ./**/*.apk
        retention-days: 30
