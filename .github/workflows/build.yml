name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 180

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare assets
      run: |
        mkdir -p assets bin
        if [ ! -f assets/alarm.mp3 ]; then
          touch assets/alarm.mp3
        fi
        if [ ! -f assets/icon.png ]; then
          touch assets/icon.png
        fi
        ls -la

    - name: Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install system dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ccache \
          git \
          libncurses5:i386 \
          libstdc++6:i386 \
          libgtk2.0-0:i386 \
          libpangox-1.0-0:i386 \
          libpangoxft-1.0-0:i386 \
          libidn11:i386 \
          python3 \
          python3-dev \
          python3-pip \
          unzip \
          zlib1g-dev \
          libzbar-dev \
          libltdl-dev \
          pkg-config \
          autoconf \
          automake \
          libtool \
          openjdk-11-jdk \
          wget \
          curl \
          zip \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install Cython==0.29.37
        pip install buildozer==1.4.1
        pip install python-for-android==2023.03.13

    - name: Show buildozer spec
      run: cat buildozer.spec

    - name: Build APK
      run: |
        set -x
        export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
        export ANDROID_NDK_HOME="$HOME/.buildozer/android/platform/android-ndk-r25b"
        buildozer android debug 2>&1 | tee buildozer.log

    - name: Check for APK
      if: always()
      run: |
        ls -la bin/ 2>/dev/null || true
        find . -name "*.apk" 2>/dev/null || true
        ls -la buildozer.log || true

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/dists/clock3/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: buildozer.log
        retention-days: 14
