name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare assets
      run: |
        mkdir -p assets bin
        if [ ! -f assets/alarm.mp3 ]; then
          touch assets/alarm.mp3
        fi
        if [ ! -f assets/icon.png ]; then
          touch assets/icon.png
        fi
        ls -la assets/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-pip \
          build-essential \
          git \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgdbm-dev \
          libncurses5-dev \
          libsqlite3-dev \
          libffi-dev \
          libtool \
          unzip \
          openjdk-17-jdk \
          zipalign \
          wget \
          unzip

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36
        pip install buildozer==1.5.0

    - name: Set up Android SDK
      run: |
        export ANDROID_HOME="$HOME/android-sdk"
        mkdir -p "$ANDROID_HOME"
        
        echo "=== Downloading Android SDK ==="
        cd "$ANDROID_HOME"
        
        if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          rm -f cmdline-tools.zip
        fi
        
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        
        echo "=== Accepting licenses ==="
        yes | sdkmanager --licenses 2>/dev/null || true
        
        echo "=== Installing SDK components ==="
        sdkmanager --install \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "platform-tools" \
          "ndk;25.1.8937393" \
          "cmake;3.22.1"
        
        echo "=== Creating local.properties ==="
        cd /home/runner/work/Clock-3/Clock-3
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/25.1.8937393" >> local.properties
        
        echo "=== SDK Setup Complete ==="
        ls -la "$ANDROID_HOME"

    - name: Show buildozer.spec
      run: |
        echo "=== buildozer.spec ==="
        cat buildozer.spec

    - name: Build APK
      id: build
      timeout-minutes: 45
      env:
        ANDROID_HOME: ${{ runner.home }}/android-sdk
        ANDROIDSDK: ${{ runner.home }}/android-sdk
        ANDROIDNDK: ${{ runner.home }}/android-sdk/ndk/25.1.8937393
      run: |
        set -e
        export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
        export ANDROIDSDK="$ANDROID_HOME"
        export ANDROIDNDK="$ANDROID_HOME/ndk/25.1.8937393"
        
        echo "=== Environment ==="
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROIDSDK=$ANDROIDSDK"
        echo "ANDROIDNDK=$ANDROIDNDK"
        ls -la "$ANDROID_HOME"
        
        echo "=== Current Directory ==="
        pwd
        ls -la
        
        echo "=== Python Version ==="
        python3 --version
        pip3 list | grep -E "(buildozer|cython|kivy)"
        
        echo "=== Clean previous builds ==="
        rm -rf .buildozer bin/*.apk 2>/dev/null || true
        
        echo "=== Building APK ==="
        buildozer android debug 2>&1 | tee buildozer.log
        BUILD_EXIT=${PIPESTATUS[0]}
        
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "Build command exited with code $BUILD_EXIT"
          echo "=== Last 100 lines of log ==="
          tail -100 buildozer.log || true
          exit 1
        fi
        
        echo "=== Build completed ==="
        ls -la bin/ 2>/dev/null || true
        find .buildozer -name '*.apk' 2>/dev/null || true

    - name: Prepare APK for upload
      run: |
        mkdir -p bin
        find .buildozer -name '*.apk' -exec cp {} bin/ \; 2>/dev/null || true
        ls -la bin/

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: buildozer.log
        retention-days: 7
