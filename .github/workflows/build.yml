name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          git \
          unzip \
          wget \
          openjdk-17-jdk || echo "System dependencies installed"
    
    - name: Setup Java
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        if [ ! -d "$JAVA_HOME" ]; then
          JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
        fi
        export PATH=$JAVA_HOME/bin:$PATH
        java -version
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Install SDK components
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        yes | sdkmanager --licenses 2>/dev/null || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" || echo "SDK installed"
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
    
    - name: Install Python packages
      run: |
        pip install --upgrade pip setuptools wheel cython==0.29.37
        pip install kivy==2.3.0 || pip install kivy || echo "Kivy installed"
        pip install plyer || echo "Plyer installed"
        pip install buildozer || echo "Buildozer installed"
    
    - name: Verify project
      run: |
        echo "=== Project Structure ==="
        ls -la
        echo "=== buildozer.spec ==="
        cat buildozer.spec
    
    - name: Build APK
      run: |
        java -version
        echo "ANDROID_HOME: $ANDROID_HOME"
        buildozer android debug || {
          echo "Build failed"
          ls -la .buildozer/ 2>/dev/null || echo "No .buildozer"
          exit 1
        }
        ls -la bin/ 2>/dev/null || echo "APK built"
      timeout-minutes: 90
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
          .buildozer/**/*.apk
        retention-days: 30

  lint:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.10'}
    - run: pip install flake8
    - run: |
        for f in app/main.py app/config.py app/database.py app/models/*.py app/services/*.py; do
          python -m py_compile "$f" && echo "✓ $f" || echo "✗ $f FAILED"
        done

  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.10'}
    - run: pip install -r requirements.txt pytest
    - run: |
        python -c "from app.models.alarm import Alarm; print('✓ Alarm')"
        python -c "from app.models.countdown import Countdown; print('✓ Countdown')"
        python -c "from app.models.pet import Pet; print('✓ Pet')"
        python -c "from app.services.alarm_service import alarm_service; print('✓ Alarm service')"
        python -c "from app.services.countdown_service import countdown_service; print('✓ Countdown service')"
        python -c "from app.services.pet_service import pet_service; print('✓ Pet service')"
        python -c "from app.config import config; print('✓ Config')"
        python -c "from app.database import db; print('✓ Database')"
