name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        echo "Installing system dependencies..."
        sudo apt-get update || true
        sudo apt-get install -y --no-install-recommends \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          git \
          unzip \
          wget \
          openjdk-17-jdk || echo "Package installation completed"
    
    - name: Setup Java
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        if [ ! -d "$JAVA_HOME" ]; then
          JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))
        fi
        export PATH=$JAVA_HOME/bin:$PATH
        java -version
        echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
        echo "PATH=$JAVA_HOME/bin:$PATH" >> $GITHUB_ENV
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        ndk-level: 25
        build-tools: 33.0.2
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.37
        pip install -r requirements.txt
        pip install buildozer==1.6.0
    
    - name: Verify project
      run: |
        echo "=== Project Files ==="
        ls -la
        echo "=== App Files ==="
        ls -la app/
        echo "=== buildozer.spec ==="
        cat buildozer.spec
    
    - name: Build debug APK
      id: build_apk
      run: |
        java -version
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        
        buildozer android debug || {
          echo "=== Build failed, checking logs ==="
          ls -la .buildozer/ 2>/dev/null || echo "No .buildozer directory"
          find . -name "*.log" 2>/dev/null | head -5
          exit 1
        }
        
        echo "=== Build completed ==="
        ls -la bin/ 2>/dev/null || echo "Checking for APK files..."
        find . -name "*.apk" -type f 2>/dev/null
      timeout-minutes: 90
    
    - name: List APK files
      run: |
        echo "=== APK Files ==="
        find . -name "*.apk" -type f -exec ls -lh {} \; 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: clock3-debug-apk
        path: |
          bin/*.apk
          .buildozer/**/*.apk
        retention-days: 30
        overwrite: true

  lint:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install flake8
    
    - name: Check Python syntax
      run: |
        echo "=== Syntax Check ==="
        for f in app/main.py app/config.py app/database.py app/models/*.py app/services/*.py; do
          python -m py_compile "$f" && echo "✓ $f" || echo "✗ $f FAILED"
        done
    
    - name: Run flake8 linter
      run: |
        echo "=== Linting ==="
        flake8 app/ --max-line-length=120 --ignore=E501,W503 || echo "Linting warnings found"

  test:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install test dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run Python tests
      run: |
        echo "=== Import Tests ==="
        python -c "from app.models.alarm import Alarm; print('✓ Alarm model')"
        python -c "from app.models.countdown import Countdown; print('✓ Countdown model')"
        python -c "from app.models.pet import Pet; print('✓ Pet model')"
        python -c "from app.services.alarm_service import alarm_service; print('✓ Alarm service')"
        python -c "from app.services.countdown_service import countdown_service; print('✓ Countdown service')"
        python -c "from app.services.pet_service import pet_service; print('✓ Pet service')"
        python -c "from app.config import config; print('✓ Config')"
        python -c "from app.database import db; print('✓ Database')"
        echo "All imports successful!"
