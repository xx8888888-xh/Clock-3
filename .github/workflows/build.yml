name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare assets
      run: |
        mkdir -p assets
        if [ ! -f assets/alarm.mp3 ]; then
          touch assets/alarm.mp3
        fi
        if [ ! -f assets/icon.png ]; then
          touch assets/icon.png
        fi
        ls -la assets/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-pip \
          build-essential \
          git \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgdbm-dev \
          libncurses5-dev \
          libsqlite3-dev \
          libffi-dev \
          libtool \
          unzip \
          openjdk-17-jdk \
          zipalign

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36
        pip install buildozer==1.5.0

    - name: Set up Android SDK with caching
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools: 33.0.2
        components: platform-tools

    - name: Configure Android SDK
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties
        
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license

    - name: Show environment
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME/ 2>/dev/null || echo "SDK not found"
        which sdkmanager || echo "sdkmanager not found"

    - name: Show buildozer.spec
      run: |
        echo "=== buildozer.spec ==="
        cat buildozer.spec

    - name: Build APK
      id: build
      continue-on-error: true
      run: |
        export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
        export ANDROIDSDK="$ANDROID_HOME"
        
        echo "=== Environment ==="
        env | grep -E "(ANDROID|PYTHON)" || true
        
        echo "=== Building APK with buildozer ==="
        
        buildozer android debug 2>&1 | tee buildozer.log
        
        BUILD_EXIT=$?
        echo "Buildozer exit code: $BUILD_EXIT"
        
        echo "=== Checking for APK ==="
        if ls bin/*.apk 2>/dev/null; then
          echo "SUCCESS: APK found in bin/"
          ls -lh bin/*.apk
          echo "APK_BUILT=true" >> $GITHUB_ENV
        elif find .buildozer -name "*.apk" 2>/dev/null | head -1 | xargs -I {} ls -lh {} 2>/dev/null; then
          echo "SUCCESS: APK found in .buildozer"
          find .buildozer -name "*.apk" -exec cp {} bin/ \;
          ls -lh bin/*.apk
          echo "APK_BUILT=true" >> $GITHUB_ENV
        else
          echo "APK not found in expected locations"
          echo "=== Last 200 lines of buildozer.log ==="
          tail -200 buildozer.log || true
          echo "APK_BUILT=false" >> $GITHUB_ENV
        fi
        
        exit $BUILD_EXIT

    - name: Show build log on failure
      if: failure()
      run: |
        echo "=== Full buildozer.log ==="
        cat buildozer.log 2>/dev/null || echo "No log file found"

    - name: Upload APK
      if: success() && env.APK_BUILT == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
        retention-days: 30
