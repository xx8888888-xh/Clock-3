name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libgmp-dev \
          libmpc-dev \
          git \
          unzip \
          openjdk-17-jdk \
          wget
    
    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        java -version
    
    - name: Download Android SDK
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        
        if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        fi
        
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" > /dev/null 2>&1
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV
        
        echo "Android SDK setup complete"
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install setuptools wheel
        pip install cython==0.29.37
        pip install -r requirements.txt
        pip install buildozer
    
    - name: Cache Buildozer and dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.local
          ~/.cache
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-
          ${{ runner.os }}-
    
    - name: Prepare Buildozer
      run: |
        mkdir -p ~/.buildozer
        cat > ~/.buildozer/buildozer.spec << 'EOF'
        [buildozer]
        log_level = 2
        warn_on_root = 0
        EOF
    
    - name: Build debug APK
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        buildozer android debug
      working-directory: .
      timeout-minutes: 60
    
    - name: Check for APK
      run: |
        ls -lh bin/ || echo "bin directory not found"
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clock3-debug-apk
        path: |
          bin/*.apk
          .buildozer/**/*.apk
        retention-days: 30
        allow-f overwrite: true
    
    - name: Create Release on Success
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        echo "Build successful! APK ready for release."
        echo "VERSION=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_ENV
    
    - name: Display Build Summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- APK Location: bin/*.apk" >> $GITHUB_STEP_SUMMARY
        echo "- Build Time: $(date)" >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install flake8
    
    - name: Check Python syntax
      run: |
        python -m py_compile app/main.py && echo "✓ main.py OK"
        python -m py_compile app/config.py && echo "✓ config.py OK"
        python -m py_compile app/database.py && echo "✓ database.py OK"
        python -m py_compile app/models/alarm.py && echo "✓ models/alarm.py OK"
        python -m py_compile app/models/countdown.py && echo "✓ models/countdown.py OK"
        python -m py_compile app/models/pet.py && echo "✓ models/pet.py OK"
        python -m py_compile app/services/alarm_service.py && echo "✓ services/alarm_service.py OK"
        python -m py_compile app/services/countdown_service.py && echo "✓ services/countdown_service.py OK"
        python -m py_compile app/services/pet_service.py && echo "✓ services/pet_service.py OK"
    
    - name: Run flake8 linter
      run: |
        flake8 app/ --max-line-length=120 --ignore=E501,W503 --show-source || echo "Linting completed with warnings"

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install test dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run Python tests
      run: |
        python -c "from app.models.alarm import Alarm; print('✓ Alarm model imports successfully')"
        python -c "from app.models.countdown import Countdown; print('✓ Countdown model imports successfully')"
        python -c "from app.models.pet import Pet; print('✓ Pet model imports successfully')"
        python -c "from app.services.alarm_service import alarm_service; print('✓ Alarm service imports successfully')"
        python -c "from app.services.countdown_service import countdown_service; print('✓ Countdown service imports successfully')"
        python -c "from app.services.pet_service import pet_service; print('✓ Pet service imports successfully')"
        python -c "from app.config import config; print('✓ Config imports successfully')"
        python -c "from app.database import db; print('✓ Database imports successfully')"
        echo "All imports successful!"

  all-checks:
    needs: [build, lint, test]
    runs-on: ubuntu-latest
    steps:
    - name: All checks passed
      run: |
        echo "✓ All checks completed"
        echo "## Final Status" >> $GITHUB_STEP_SUMMARY
        echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Test: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Time: $(date)" >> $GITHUB_STEP_SUMMARY
