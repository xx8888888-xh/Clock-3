name: Build Android APK with Docker

on:
  push:
    branches: [ main, master, kotlin-version ]
  pull_request:
    branches: [ main, master, kotlin-version ]
  workflow_dispatch:

env:
  BUILDOZER_VERSION: "1.5.0"
  DOCKER_IMAGE: "kivy/buildozer:1.5.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install lint tools
      run: pip install flake8 black
    
    - name: Run linting
      run: |
        echo "=== Running flake8 ==="
        flake8 app/ --max-line-length=120 --ignore=E501,W503 || true
        
        echo "=== Checking Python syntax ==="
        for f in app/main.py app/config.py app/database.py app/models/*.py app/services/*.py; do
          python -m py_compile "$f" 2>&1 && echo "✓ $f" || { echo "✗ $f FAILED"; exit 1; }
        done

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install kivy plyer
    
    - name: Run tests
      run: |
        echo "=== Testing module imports ==="
        python -c "from app.models.alarm import Alarm; print('✓ Alarm model')"
        python -c "from app.models.countdown import Countdown; print('✓ Countdown model')"
        python -c "from app.models.pet import Pet; print('✓ Pet model')"
        python -c "from app.services.alarm_service import alarm_service; print('✓ Alarm service')"
        python -c "from app.services.countdown_service import countdown_service; print('✓ Countdown service')"
        python -c "from app.services.pet_service import pet_service; print('✓ Pet service')"
        python -c "from app.config import config; print('✓ Config')"
        python -c "from app.database import db; print('✓ Database')"
        
        echo "=== Testing Pet.is_sleeping() logic ==="
        python -c "
from app.models.pet import Pet
pet = Pet()
hour = 23
print(f'Testing hour {hour}: is_sleeping = {22 <= hour < 7}')  # Should be True
hour = 3
print(f'Testing hour {hour}: is_sleeping = {22 <= hour < 7}')  # Should be True
hour = 10
print(f'Testing hour {hour}: is_sleeping = {22 <= hour < 7}')  # Should be False
"

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Check assets directory
      run: |
        echo "=== Checking assets directory ==="
        if [ -d "assets" ]; then
          echo "✓ assets directory exists"
          ls -la assets/
        else
          echo "✗ assets directory missing - creating"
          mkdir -p assets
          touch assets/alarm.mp3
          touch assets/icon.png
        fi
    
    - name: Check buildozer.spec
      run: |
        echo "=== Checking buildozer.spec ==="
        if [ -f "buildozer.spec" ]; then
          echo "✓ buildozer.spec exists"
        else
          echo "✗ buildozer.spec missing - aborting build"
          exit 1
        fi
    
    - name: Build APK using Kivy Buildozer Docker
      run: |
        set -e
        
        echo "=== Build Configuration ==="
        echo "BUILDOZER_VERSION: $BUILDOZER_VERSION"
        echo "DOCKER_IMAGE: $DOCKER_IMAGE"
        echo "Python version: $(python3 --version)"
        
        echo "=== Pulling buildozer image ==="
        docker pull "$DOCKER_IMAGE" || docker pull kivy/buildozer:latest
        
        echo "=== Starting build ==="
        docker run --rm \
          -v $(pwd):/home/user/clock3 \
          -w /home/user/clock3 \
          -e BUILDOZER_VERSION="$BUILDOZER_VERSION" \
          kivy/buildozer \
          /bin/sh -c "
            set -e
            echo 'Installing dependencies...'
            pip install buildozer==$BUILDOZER_VERSION || true
            
            echo 'Creating buildozer config directory...'
            mkdir -p ~/.buildozer
            
            echo 'Accepting Android SDK licenses...'
            yes | buildozer android debug || true
            
            echo 'Building APK...'
            buildozer android debug 2>&1 || { echo 'Build failed'; cat .buildozer/logs/*; exit 1; }
            
            echo 'Build completed!'
            ls -la bin/ 2>/dev/null || echo 'Checking dist directories...'
            find . -name '*.apk' 2>/dev/null || true
          "
        
        echo "=== Checking build output ==="
        if [ -f "bin/clock3-*-debug.apk" ]; then
          echo "✓ APK found in bin/"
          ls -lh bin/*.apk
        elif [ -d ".buildozer/android/platform" ]; then
          echo "✓ Build directory exists"
          find .buildozer -name '*.apk' -type f 2>/dev/null
        else
          echo "✗ No APK found"
          ls -la
          exit 1
        fi
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: clock3-debug-apk-${{ github.run_number }}
        path: |
          bin/*.apk
          .buildozer/android/platform/*/dists/*/build/*/outputs/apk/**/*.apk
          .buildozer/android/platform/*/dists/*/*.apk
        retention-days: 30
        overwrite: true
    
    - name: Upload build logs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs-${{ github.run_number }}
        path: |
          .buildozer/logs/**
          build.log
        retention-days: 7
