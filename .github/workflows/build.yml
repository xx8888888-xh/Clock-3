name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare assets
      run: |
        mkdir -p assets
        touch assets/alarm.mp3
        touch assets/icon.png
        ls -la assets/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-pip \
          build-essential \
          git \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgdbm-dev \
          libncurses5-dev \
          libsqlite3-dev \
          libffi-dev \
          libtool \
          unzip \
          openjdk-17-jdk

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer==1.5.0
        pip install cython==0.29.36

    - name: Install Android SDK
      run: |
        mkdir -p $HOME/.local/android-sdk
        cd $HOME/.local/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        rm cmdline-tools.zip
        
        export ANDROID_HOME=$HOME/.local/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses 2>/dev/null || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

    - name: Configure Android SDK
      run: |
        echo "sdk.dir=$HOME/.local/android-sdk" > local.properties
        cat local.properties

        mkdir -p $HOME/.local/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.local/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $HOME/.local/android-sdk/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.local/android-sdk/licenses/android-sdk-license

    - name: Configure environment
      run: |
        export ANDROID_HOME=$HOME/.local/android-sdk
        export ANDROIDSDK=$ANDROID_HOME
        export ANDROIDNDK=$ANDROID_HOME/ndk/25b
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROIDSDK=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV

    - name: Show buildozer.spec
      run: |
        echo "=== buildozer.spec ==="
        cat buildozer.spec

    - name: Build APK
      run: |
        export ANDROID_HOME=$HOME/.local/android-sdk
        export ANDROIDSDK=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        echo "=== Environment ==="
        env | grep -i android || true
        
        echo "=== Building APK ==="
        buildozer android debug --verbose 2>&1 | tee buildozer.log
        
        echo "=== Checking for APK ==="
        if [ -f "bin/*.apk" ]; then
          echo "SUCCESS: APK found!"
          ls -lh bin/*.apk
        elif [ -f ".buildozer/android/platform/build-*/bin/*.apk" ]; then
          echo "SUCCESS: APK found in .buildozer!"
          find .buildozer -name "*.apk" -exec ls -lh {} \;
          cp $(find .buildozer -name "*.apk" | head -1) bin/ 2>/dev/null || true
        else
          echo "APK not found"
          find . -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== Last 100 lines of buildozer.log ==="
          tail -100 buildozer.log || true
        fi

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
          .buildozer/**/bin/*.apk
        retention-days: 30
