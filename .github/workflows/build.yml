name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4

    - name: Prepare
      run: |
        mkdir -p assets bin
        touch assets/alarm.mp3
        touch assets/icon.png

    - name: Build with Docker
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        options: -v ${{ github.workspace }}:/home/user/clock3 -w /home/user/clock3 -u root
        run: |
          ls -la
          buildozer android debug
          ls -la bin/

    - name: Check
      if: always()
      run: |
        ls -la bin/ || true
        ls -la || true
        find . -name "*.apk" -type f 2>/dev/null || true
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: clock3-apk
        path: bin/*.apk
        
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: buildozer.log
