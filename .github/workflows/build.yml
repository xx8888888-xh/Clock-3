name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare assets
      run: |
        mkdir -p assets bin
        if [ ! -f assets/alarm.mp3 ]; then
          touch assets/alarm.mp3
        fi
        if [ ! -f assets/icon.png ]; then
          touch assets/icon.png
        fi
        ls -la assets/

    - name: Show buildozer.spec
      run: |
        echo "=== buildozer.spec ==="
        cat buildozer.spec

    - name: Build APK with Docker
      id: build
      run: |
        set +e
        docker pull kivy/buildozer
        
        docker run --rm -v "${PWD}:/home/user/clock3" \
          -w /home/user/clock3 \
          kivy/buildozer \
          bash -c "
            echo '=== Starting build ==='
            ls -la
            buildozer android debug
          "

    - name: Check for APK
      id: check_apk
      run: |
        ls -la bin/ 2>/dev/null || echo "No bin directory"
        ls -la .buildozer/ 2>/dev/null || echo "No buildozer dir"
        find . -name "*.apk" 2>/dev/null || echo "No APK found"

    - name: Upload build artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/dists/clock3/build/outputs/apk/debug/*.apk
          buildozer.log
        retention-days: 14

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/dists/clock3/build/outputs/apk/debug/*.apk
        retention-days: 30
