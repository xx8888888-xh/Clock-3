name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 300

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Prepare files
      run: |
        mkdir -p assets
        touch assets/alarm.mp3
        touch assets/icon.png

    - name: Build with Buildozer
      uses: kivy/buildozer-action@master
      with:
        command: android debug

    - name: Check build
      if: always()
      run: |
        ls -la bin/ || true
        ls -la || true
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: bin/*.apk
        retention-days: 30
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          buildozer.log
          bin/
        retention-days: 7
