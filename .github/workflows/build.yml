name: Build Android APK with Docker

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Create assets if missing
      run: |
        mkdir -p assets
        if [ ! -f assets/alarm.mp3 ]; then touch assets/alarm.mp3; fi
        if [ ! -f assets/icon.png ]; then touch assets/icon.png; fi
        ls -la assets/
    
    - name: Verify buildozer.spec exists
      run: |
        if [ ! -f buildozer.spec ]; then
          echo "ERROR: buildozer.spec not found!"
          ls -la
          exit 1
        fi
        echo "buildozer.spec exists"
    
    - name: Build APK
      run: |
        echo "=== Starting Docker build ==="
        docker run --rm \
          -v $(pwd):/home/user/clock3 \
          -w /home/user/clock3 \
          kivy/buildozer:latest \
          /bin/sh -c "
            echo 'Building APK...'
            buildozer android debug 2>&1 | tee build.log
            echo 'Build finished'
            echo '=== Build artifacts ==='
            find . -name '*.apk' -type f 2>/dev/null || echo 'No APK files found'
          "
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
          .buildozer/**/bin/*.apk
          ./**/*.apk
        retention-days: 7
        ignore-no-files: true
