name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    
    timeout-minutes: 45

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare assets
      run: |
        mkdir -p assets
        if [ ! -f assets/alarm.mp3 ]; then
          touch assets/alarm.mp3
        fi
        if [ ! -f assets/icon.png ]; then
          touch assets/icon.png
        fi
        mkdir -p bin
        ls -la assets/

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-dev \
          python3-pip \
          build-essential \
          git \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgdbm-dev \
          libncurses5-dev \
          libsqlite3-dev \
          libffi-dev \
          libtool \
          unzip \
          openjdk-17-jdk \
          zipalign

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip setuptools wheel
        pip install cython==0.29.36
        pip install buildozer==1.5.0

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        accept-android-sdk-licenses: true
        packages: |
          platforms;android-33
          build-tools;33.0.2
          platform-tools

    - name: Configure Android SDK
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        cat local.properties
        
        mkdir -p $ANDROID_HOME/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license

    - name: Show environment
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME/ 2>/dev/null || echo "SDK not found"
        which sdkmanager || echo "sdkmanager not found"

    - name: Show buildozer.spec
      run: |
        echo "=== buildozer.spec ==="
        cat buildozer.spec

    - name: Build APK
      id: build
      timeout-minutes: 40
      run: |
        export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
        export ANDROIDSDK="$ANDROID_HOME"
        
        echo "=== Current Directory ==="
        pwd
        ls -la
        
        echo "=== Environment ==="
        env | grep -E "(ANDROID|PYTHON)" || true
        
        echo "=== Check Python ==="
        which python3
        python3 --version
        pip3 list | grep -E "(buildozer|cython|kivy)"
        
        echo "=== Check Android SDK ==="
        ls -la $ANDROID_HOME/ 2>/dev/null || echo "SDK not found"
        which sdkmanager 2>/dev/null || echo "sdkmanager not found"
        
        echo "=== Check source files ==="
        ls -la *.py app/*.py 2>/dev/null || true
        
        echo "=== Building APK with buildozer ==="
        
        set +e
        buildozer android debug 2>&1 | tee buildozer.log
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "Buildozer exit code: $BUILD_EXIT"
        
        echo "=== Checking for APK ==="
        mkdir -p bin
        
        if ls bin/*.apk 2>/dev/null; then
          echo "SUCCESS: APK found in bin/"
          ls -lh bin/*.apk
        elif find .buildozer -name "*.apk" 2>/dev/null | head -1 | xargs -I {} ls -lh {} 2>/dev/null; then
          echo "SUCCESS: APK found in .buildozer"
          find .buildozer -name "*.apk" -exec cp {} bin/ \; 2>/dev/null || true
          ls -lh bin/*.apk 2>/dev/null || true
        else
          echo "APK not found in expected locations"
          echo "=== Last 200 lines of buildozer.log ==="
          tail -200 buildozer.log || true
        fi
        
        echo "=== Saving build log ==="
        cp buildozer.log build_log.txt 2>/dev/null || true

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: |
          buildozer.log
          build_log.txt
          local.properties
        retention-days: 7

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
        retention-days: 30
