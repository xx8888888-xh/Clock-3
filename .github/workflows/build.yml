name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare assets and permissions
      run: |
        mkdir -p assets bin
        touch assets/alarm.mp3
        touch assets/icon.png
        ls -la

    - name: Pull buildozer image
      run: docker pull kivy/buildozer:latest

    - name: Build APK using docker
      id: build
      run: |
        set -e
        echo "Starting build..."
        docker run --rm -v "${PWD}:/home/user/clock3" -w /home/user/clock3 \
          -e "HOME=/home/user" \
          -e "USER=user" \
          kivy/buildozer bash -c "
            ls -la
            echo '=== Building APK ==='
            buildozer android debug
            ls -la bin/
          "
          
    - name: List output files
      if: always()
      run: |
        ls -la bin/ || true
        ls -la || true
        
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: bin/*.apk
        retention-days: 30
        
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          buildozer.log
          bin/
        retention-days: 7
