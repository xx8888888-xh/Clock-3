name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.8'

    - name: Prepare assets
      run: |
        mkdir -p assets bin
        touch assets/alarm.mp3
        touch assets/icon.png

    - name: Install dependencies
      run: |
        pip3 install --upgrade pip setuptools wheel
        pip3 install cython==0.29.37
        pip3 install buildozer==1.5.0

    - name: Buildozer dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3-pip python3-dev libncurses5:i386 libstdc++6:i386 zlib1g:i386 autoconf libtool pkg-config zlib1g-dev openjdk-11-jdk-headless

    - name: Build APK
      id: build
      run: |
        ls -la
        buildozer android debug 2>&1 | tee buildozer.log
        
    - name: Check build
      if: always()
      run: |
        ls -la bin/ || true
        ls -la || true
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: clock3-apk
        path: bin/*.apk
        
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-artifacts
        path: |
          buildozer.log
          bin/
