name: Build Android APK

on:
  push:
    branches: [ main, master, integrated-branch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - uses: actions/checkout@v4

    - name: Prepare
      run: |
        mkdir -p assets bin
        touch assets/alarm.mp3
        touch assets/icon.png

    - name: Build with Docker
      id: build
      uses: addnab/docker-run-action@v3
      with:
        image: kivy/buildozer:latest
        options: -v ${{ github.workspace }}:/home/user/clock3 -w /home/user/clock3 -u root
        run: |
          echo "=== System Info ===" | tee buildozer.log
          whoami | tee -a buildozer.log
          pwd | tee -a buildozer.log
          ls -la | tee -a buildozer.log
          echo "=== Build Config ===" | tee -a buildozer.log
          cat buildozer.spec | tee -a buildozer.log
          echo "=== Build Start ===" | tee -a buildozer.log
          date | tee -a buildozer.log
          buildozer android debug 2>&1 | tee -a buildozer.log
          echo "=== Build Complete ===" | tee -a buildozer.log
          date | tee -a buildozer.log
          echo "=== Find APK in entire filesystem ===" | tee -a buildozer.log
          find / -name "*.apk" 2>/dev/null | tee -a buildozer.log || echo "No APK found" | tee -a buildozer.log
          echo "=== Check common locations ===" | tee -a buildozer.log
          ls -la /home/user/clock3/bin/ 2>/dev/null | tee -a buildozer.log || echo "bin/ not found" | tee -a buildozer.log
          ls -la /home/user/clock3/.buildozer/android/platform/python-for-android/dist/ 2>/dev/null | tee -a buildozer.log || echo "dist/ not found" | tee -a buildozer.log
          ls -la /home/user/.buildozer/ 2>/dev/null | tee -a buildozer.log || echo ".buildozer not found" | tee -a buildozer.log
          echo "=== Copy APK to bin ===" | tee -a buildozer.log
          mkdir -p /home/user/clock3/bin
          find /home/user -name "*.apk" -exec cp {} /home/user/clock3/bin/ \; 2>/dev/null && echo "APK copied" | tee -a buildozer.log || echo "No APK to copy" | tee -a buildozer.log
          ls -la /home/user/clock3/bin/ | tee -a buildozer.log

    - name: Check files
      if: always()
      run: |
        echo "=== Runner filesystem ==="
        ls -la bin/ || echo "No bin directory"
        echo "=== All APKs ==="
        find . -name "*.apk" 2>/dev/null || echo "No APK found"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clock3-apk
        path: |
          bin/*.apk

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: |
          buildozer.log
