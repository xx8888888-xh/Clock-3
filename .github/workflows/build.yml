name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Prepare assets
      run: |
        mkdir -p assets
        touch assets/alarm.mp3
        touch assets/icon.png
        ls -la assets/
    
    - name: Build APK with Docker
      run: |
        echo "=== Step 1: Pull Docker image ==="
        docker pull kivy/buildozer:latest || echo "Pull failed, trying to use cached..."
        
        echo "=== Step 2: Run Docker build ==="
        set +e  # Don't exit on error, we want to see logs
        
        docker run --rm \
          -v $(pwd):/home/user/clock3 \
          -w /home/user/clock3 \
          kivy/buildozer:latest \
          /bin/sh -c "
            set -e
            echo '=== Docker Environment ==='
            pwd
            ls -la
            echo 'sdk.dir=/opt/android-sdk' > local.properties
            echo '=== Checking buildozer.spec ==='
            cat buildozer.spec | head -20
            echo '=== Starting buildozer build ==='
            buildozer android debug 2>&1 | tee buildozer.log
            echo '=== Build finished ==='
          "
        
        DOCKER_EXIT=$?
        echo "Docker command exit code: $DOCKER_EXIT"
        
        echo "=== Checking for APK ==="
        if [ -f "bin/clock3-*-debug.apk" ]; then
          echo "SUCCESS: APK found!"
          ls -lh bin/
        elif [ -f "bin/*.apk" ]; then
          echo "SUCCESS: APK found in bin/"
          ls -lh bin/*.apk
        else
          echo "APK not found in expected location"
          find . -name "*.apk" 2>/dev/null || echo "No APK files found"
          echo "=== buildozer.log (if exists) ==="
          cat buildozer.log 2>/dev/null || echo "No log file"
        fi
        
        if [ $DOCKER_EXIT -ne 0 ]; then
          echo "Docker command failed with exit code $DOCKER_EXIT"
          exit $DOCKER_EXIT
        fi
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-apk
        path: |
          bin/*.apk
          .buildozer/**/bin/*.apk
        retention-days: 30
