name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  BUILD_DURATION_SECONDS: 0

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libtinfo5 \
          cmake \
          libffi-dev \
          libssl-dev \
          libgmp-dev \
          libmpc-dev \
          git \
          unzip \
          openjdk-17-jdk \
          wget
    
    - name: Set JAVA_HOME
      run: |
        echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $GITHUB_ENV
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        java -version
    
    - name: Download Android SDK
      id: android-sdk
      run: |
        mkdir -p $HOME/android-sdk
        cd $HOME/android-sdk
        
        if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        fi
        
        export ANDROID_HOME=$HOME/android-sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" || echo "SDK installation completed with warnings"
        
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools" >> $GITHUB_ENV
        
        echo "Android SDK setup complete"
    
    - name: Verify buildozer.spec exists
      run: |
        ls -la buildozer.spec
        echo "--- buildozer.spec content ---"
        cat buildozer.spec
    
    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install setuptools wheel
        pip install cython==0.29.37
        pip install -r requirements.txt
        pip install buildozer==1.5.0
    
    - name: Prepare Buildozer environment
      run: |
        mkdir -p ~/.buildozer
        mkdir -p bin
        mkdir -p .buildozer
        
        if [ ! -f buildozer.spec ]; then
          echo "ERROR: buildozer.spec not found!"
          exit 1
        fi
    
    - name: Build debug APK
      id: build
      run: |
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        
        echo "JAVA_HOME: $JAVA_HOME"
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        
        buildozer android debug || {
          echo "Buildozer build failed, checking logs..."
          find . -name "*.log" -type f 2>/dev/null | head -5
          exit 1
        }
      working-directory: .
      timeout-minutes: 60
      continue-on-error: true
    
    - name: Check for APK
      id: check-apk
      run: |
        echo "Checking for APK files..."
        echo "Current directory contents:"
        ls -la
        
        if [ -d "bin" ]; then
          echo "bin/ directory contents:"
          ls -lh bin/
        fi
        
        echo "Searching for APK files:"
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        
        APK_COUNT=$(find . -name "*.apk" -type f 2>/dev/null | wc -l)
        echo "Found $APK_COUNT APK file(s)"
        
        if [ $APK_COUNT -eq 0 ]; then
          echo "WARNING: No APK files found!"
          echo "Build directory contents:"
          ls -la .buildozer/ 2>/dev/null || echo ".buildozer directory not found"
        fi
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clock3-debug-apk
        path: |
          bin/*.apk
          .buildozer/**/*.apk
        retention-days: 30
        overwrite: true
    
    - name: Display Build Summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- Build Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
        echo "- APK Check: ${{ steps.check-apk.outputs.apk-found || 'Unknown' }}" >> $GITHUB_STEP_SUMMARY
        echo "- Build Time: $(date)" >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install flake8
    
    - name: Check Python syntax
      run: |
        echo "Checking Python syntax..."
        python -m py_compile app/main.py && echo "✓ main.py OK"
        python -m py_compile app/config.py && echo "✓ config.py OK"
        python -m py_compile app/database.py && echo "✓ database.py OK"
        python -m py_compile app/models/alarm.py && echo "✓ models/alarm.py OK"
        python -m py_compile app/models/countdown.py && echo "✓ models/countdown.py OK"
        python -m py_compile app/models/pet.py && echo "✓ models/pet.py OK"
        python -m py_compile app/services/alarm_service.py && echo "✓ services/alarm_service.py OK"
        python -m py_compile app/services/countdown_service.py && echo "✓ services/countdown_service.py OK"
        python -m py_compile app/services/pet_service.py && echo "✓ services/pet_service.py OK"
    
    - name: Run flake8 linter
      run: |
        echo "Running flake8 linter..."
        flake8 app/ --max-line-length=120 --ignore=E501,W503 || echo "Linting completed with warnings"

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install test dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run Python tests
      run: |
        echo "Testing Python imports..."
        python -c "from app.models.alarm import Alarm; print('✓ Alarm model imports successfully')"
        python -c "from app.models.countdown import Countdown; print('✓ Countdown model imports successfully')"
        python -c "from app.models.pet import Pet; print('✓ Pet model imports successfully')"
        python -c "from app.services.alarm_service import alarm_service; print('✓ Alarm service imports successfully')"
        python -c "from app.services.countdown_service import countdown_service; print('✓ Countdown service imports successfully')"
        python -c "from app.services.pet_service import pet_service; print('✓ Pet service imports successfully')"
        python -c "from app.config import config; print('✓ Config imports successfully')"
        python -c "from app.database import db; print('✓ Database imports successfully')"
        echo "All imports successful!"
