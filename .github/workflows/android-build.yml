name: Build Android APK

on:
  push:
    branches: [ kotlin-version ]
  pull_request:
    branches: [ kotlin-version ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug: Check android directory
        run: |
          echo "=== android/ directory ==="
          ls -la android/
          echo ""
          echo "=== gradlew exists? ==="
          ls -la android/gradlew 2>/dev/null || echo "gradlew NOT found"
          echo ""
          echo "=== gradle/wrapper directory ==="
          ls -la android/gradle/wrapper/ 2>/dev/null || echo "wrapper dir not found"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2

      - name: Generate gradle wrapper if missing
        run: |
          if [ ! -f "android/gradlew" ] || [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "=== Generating gradle wrapper ==="
            cd android && gradle wrapper --gradle-version=8.4 && cd ..
            ls -la android/gradle/wrapper/
          fi

      - name: Debug: Java and Gradle versions
        run: |
          echo "=== Java version ==="
          java -version
          echo ""
          echo "=== Gradle version ==="
          gradle --version || echo "Gradle command not found"
          echo ""
          echo "=== Project build.gradle.kts ==="
          cat android/build.gradle.kts

      - name: Build with Gradle
        working-directory: android
        run: |
          echo "=== gradlew permissions ==="
          chmod +x gradlew || true
          ls -la gradlew
          echo ""
          echo "=== Running gradlew assembleDebug ==="
          ./gradlew assembleDebug --no-daemon --info 2>&1 | tee build.log
          BUILD_EXIT=$?
          echo ""
          echo "=== Build exit code: $BUILD_EXIT ==="
          if [ -f build.log ]; then
            echo "=== Last 100 lines of build.log ==="
            tail -100 build.log
          fi
          exit $BUILD_EXIT

      - name: Check for APK
        run: |
          echo "=== Looking for APK files ==="
          find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
          ls -laR android/app/build/outputs/ 2>/dev/null || echo "outputs dir not found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
