name: Build Android APK

on:
  push:
    branches: [ kotlin-version ]
  pull_request:
    branches: [ kotlin-version ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/*.gradle.kts', 'android/app/*.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        packages: |
          platforms;android-34
          build-tools;34.0.0
          platform-tools
        api-level: 34

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    - name: Download gradle wrapper
      working-directory: ./android
      run: |
        mkdir -p gradle/wrapper
        curl -sL -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar
        ls -la gradle/wrapper/

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build debug APK
      working-directory: ./android
      continue-on-error: false
      run: |
        echo "=== Starting Build at $(date) ==="
        ./gradlew --version
        echo ""
        echo "=== Building APK ==="
        ./gradlew clean assembleDebug --no-daemon 2>&1 | tee build.log
        echo "=== Build finished at $(date) ==="

    - name: Show build log on failure
      if: failure()
      run: |
        echo "=== Last 200 lines of build.log ==="
        tail -200 android/build.log 2>/dev/null || echo "No build log found"

    - name: Display APK info
      run: |
        echo "=== APK Build Results ==="
        find android -name "*.apk" -type f 2>/dev/null && ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Checking build directory..."
        find android -type d -name "build" 2>/dev/null | head -5

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: clock3-debug-apk-${{ github.run_number }}
        path: |
          android/app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/**/*.apk
        retention-days: 30
        overwrite: true

    - name: Upload build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: android/build.log
        retention-days: 7
