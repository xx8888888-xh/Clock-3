name: Build Android APK

on:
  push:
    branches: [ kotlin-version ]
  pull_request:
    branches: [ kotlin-version ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.6'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/*.gradle.kts', 'android/app/*.gradle.kts') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        packages: |
          platforms;android-34
          build-tools;34.0.0
          platform-tools
        api-level: 34

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > android/local.properties
        cat android/local.properties

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: ${{ env.GRADLE_VERSION }}

    - name: Generate Gradle Wrapper
      working-directory: ./android
      run: |
        gradle wrapper --gradle-version=${{ env.GRADLE_VERSION }}
        ls -la gradle/wrapper/
        file gradle/wrapper/gradle-wrapper.jar

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build debug APK
      working-directory: ./android
      continue-on-error: false
      run: |
        echo "=== Java Version ==="
        java -version
        echo ""
        echo "=== Gradle Version ==="
        ./gradlew --version
        echo ""
        echo "=== Android SDK ==="
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls -la $ANDROID_HOME/
        echo ""
        echo "=== Project Structure ==="
        ls -la
        echo ""
        echo "=== Building APK (started at $(date)) ==="
        ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        BUILD_EXIT=$?
        echo "=== Build finished at $(date) with exit code $BUILD_EXIT ==="
        if [ $BUILD_EXIT -ne 0 ]; then
          echo "=== LAST 300 LINES OF LOG ==="
          tail -300 build.log
        fi
        exit $BUILD_EXIT

    - name: Display APK info
      if: success()
      run: |
        echo "=== APK Build Results ==="
        find android -name "*.apk" -type f
        ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "APK dir not found"

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: clock3-debug-apk-${{ github.run_number }}
        path: |
          android/app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/**/*.apk
        retention-days: 30
        overwrite: true

    - name: Upload build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_number }}
        path: android/build.log
        retention-days: 7
