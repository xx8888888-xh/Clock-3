name: Build Android APK

on:
  push:
    branches: [ kotlin-version ]
  pull_request:
    branches: [ kotlin-version ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        cache: 'gradle'

    - name: Cache Android SDK
      uses: actions/cache@v4
      id: cache-android-sdk
      with:
        path: |
          ~/.android/sdk
          ~/Library/Android/sdk
          /opt/android-sdk
        key: android-sdk-v2-${{ runner.os }}

    - name: Install Android SDK
      if: steps.cache-android-sdk.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.android/sdk
        cd ~/.android/sdk
        curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/bin cmdline-tools/latest/
        mv cmdline-tools/lib cmdline-tools/latest/
        rm cmdline-tools.zip

    - name: Accept Android licenses
      run: |
        export ANDROID_HOME=~/.android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses 2>/dev/null || true
        sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" --channel=0

    - name: Create local.properties
      run: |
        echo "sdk.dir=$HOME/.android/sdk" > android/local.properties
        cat android/local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build debug APK
      working-directory: ./android
      env:
        ANDROID_HOME: ${{ runner.os == 'macOS' && format('{0}/Library/Android/sdk', runner.workspace) || '~/.android/sdk' }}
      run: |
        export ANDROID_HOME=~/.android/sdk
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tee build.log

    - name: Show build log on failure
      if: failure()
      run: |
        echo "=== Build Log (last 200 lines) ==="
        tail -200 android/build.log 2>/dev/null || echo "No build log found"

    - name: Display APK info
      if: success()
      run: |
        echo "=== APK Build Results ==="
        ls -lh android/app/build/outputs/apk/debug/ 2>/dev/null || echo "No APK found"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: clock3-debug-apk-${{ github.run_number }}
        path: |
          android/app/build/outputs/apk/debug/*.apk
        retention-days: 30
        overwrite: true

    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log
        path: android/build.log
        retention-days: 7
